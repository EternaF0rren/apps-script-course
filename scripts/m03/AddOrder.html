<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; font-size: 13px; color: #1f2a44; padding: 4px 12px; }
      label { display: block; margin: 10px 0 4px; font-weight: bold; }
      input, select, textarea { width: 100%; box-sizing: border-box; padding: 6px; font: inherit; }
      button { margin-top: 14px; width: 100%; padding: 8px; background: #1f2a44; color: #fff; border: 0; border-radius: 4px; font: inherit; cursor: pointer; }
      button:disabled { opacity: .5; }
      #msg { margin-top: 10px; }
    </style>
  </head>
  <body>
    <form id="f" onsubmit="send(event)">
      <label>Order type</label>
      <select name="type"><option>FP</option><option>ESX</option><option>FF</option></select>
      <label>Assignee ID</label>
      <input name="workerId" placeholder="D-004" required>
      <label>Comment</label>
      <textarea name="comment" rows="3"></textarea>
      <button id="b">Add order</button>
    </form>
    <div id="msg"></div>
    <script>
      // google.script.run вызывает функцию addOrderFromForm из Dialogs.gs.
      // Имя исполнителя и супервайзера скрипт берёт с листа «Employees» по ID.
      function send(e) {
        e.preventDefault();                           // не перезагружать панель
        const form = document.getElementById('f');
        document.getElementById('b').disabled = true; // чтобы не добавить заказ дважды
        google.script.run
          .withSuccessHandler(function (id) {
            document.getElementById('msg').textContent = 'Order added: ' + id;
            form.reset();
            document.getElementById('b').disabled = false;
          })
          .withFailureHandler(function (err) {
            document.getElementById('msg').textContent = 'Error: ' + err.message;
            document.getElementById('b').disabled = false;
          })
          .addOrderFromForm(form);
      }
    </script>
  </body>
</html>
